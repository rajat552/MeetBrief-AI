version: '3.8'

services:
  # MeetBrief AI Application (FastAPI Backend + React SPA)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meetbrief-ai-app
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - ENVIRONMENT=production
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - BIFROST_ENABLED=${BIFROST_ENABLED:-true}
      - BIFROST_BASE_URL=${BIFROST_BASE_URL:-http://bifrost-gateway:8080/v1}
      - BIFROST_VIRTUAL_KEY=${BIFROST_VIRTUAL_KEY:-sk-bf-meetbrief-prod}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    depends_on:
      - bifrost-gateway

  # Maxim Bifrost AI Gateway (Optional sponsor inference routing & telemetry)
  bifrost-gateway:
    image: maximhq/bifrost:v2.6.0
    container_name: meetbrief-bifrost-gateway
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - BIFROST_VIRTUAL_KEYS='[{"id":"sk-bf-meetbrief-prod","name":"MeetBrief AI"}]'
    volumes:
      - ./bifrost_data:/app/data
