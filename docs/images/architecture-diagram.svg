<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%" style="background:#080B11; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <radialGradient id="archGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#080B11" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#E5C07B"/>
    </linearGradient>
    <filter id="shadowA" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="520" fill="#080B11"/>
  <rect width="1200" height="520" fill="url(#archGlow)"/>

  <!-- Section 1: User & UI -->
  <g transform="translate(40, 60)">
    <rect width="180" height="380" rx="16" fill="#101522" fill-opacity="0.9" stroke="rgba(212, 175, 55, 0.3)" stroke-width="1.2" filter="url(#shadowA)"/>
    
    <circle cx="90" cy="50" r="24" fill="rgba(212, 175, 55, 0.15)" stroke="#D4AF37" stroke-opacity="0.4"/>
    <text x="90" y="56" fill="#F3E5AB" font-size="20" text-anchor="middle">👤</text>
    <text x="90" y="94" fill="#F8FAFC" font-size="14" font-weight="bold" text-anchor="middle">Executive User</text>
    
    <line x1="20" y1="112" x2="160" y2="112" stroke="rgba(212, 175, 55, 0.15)"/>
    
    <rect x="18" y="130" width="144" height="42" rx="8" fill="#080B11" stroke="rgba(212, 175, 55, 0.25)"/>
    <text x="90" y="148" fill="#F3E5AB" font-size="11" font-weight="bold" text-anchor="middle">Manual Input</text>
    <text x="90" y="162" fill="#94A3B8" font-size="9" text-anchor="middle">Company, Attendee, Date</text>

    <rect x="18" y="190" width="144" height="42" rx="8" fill="#080B11" stroke="rgba(212, 175, 55, 0.25)"/>
    <text x="90" y="208" fill="#34D399" font-size="11" font-weight="bold" text-anchor="middle">React 18 / Vite</text>
    <text x="90" y="222" fill="#94A3B8" font-size="9" text-anchor="middle">Obsidian &amp; Gold UI</text>

    <rect x="18" y="250" width="144" height="42" rx="8" fill="#080B11" stroke="rgba(212, 175, 55, 0.25)"/>
    <text x="90" y="268" fill="#E5C07B" font-size="11" font-weight="bold" text-anchor="middle">Safe SSE Stream</text>
    <text x="90" y="282" fill="#94A3B8" font-size="9" text-anchor="middle">ReadableStream API</text>

    <rect x="18" y="310" width="144" height="42" rx="8" fill="#080B11" stroke="rgba(212, 175, 55, 0.25)"/>
    <text x="90" y="328" fill="#F8FAFC" font-size="11" font-weight="bold" text-anchor="middle">Print-to-PDF</text>
    <text x="90" y="342" fill="#94A3B8" font-size="9" text-anchor="middle">Physical Boardroom</text>
  </g>

  <!-- Arrow 1: UI -> FastAPI -->
  <path d="M220 250 L270 250" stroke="#D4AF37" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Section 2: FastAPI Core -->
  <g transform="translate(270, 110)">
    <rect width="180" height="280" rx="16" fill="#101522" fill-opacity="0.9" stroke="rgba(212, 175, 55, 0.3)" stroke-width="1.2" filter="url(#shadowA)"/>
    <text x="90" y="36" fill="#009688" font-size="18" text-anchor="middle">⚡</text>
    <text x="90" y="60" fill="#F8FAFC" font-size="14" font-weight="bold" text-anchor="middle">FastAPI Server</text>
    <text x="90" y="78" fill="#94A3B8" font-size="10" text-anchor="middle">Port 5000 &bull; Pydantic v2</text>
    <line x1="20" y1="92" x2="160" y2="92" stroke="rgba(212, 175, 55, 0.15)"/>

    <rect x="18" y="106" width="144" height="34" rx="6" fill="#080B11" stroke="rgba(0, 150, 136, 0.3)"/>
    <text x="90" y="127" fill="#F3E5AB" font-size="10" font-weight="bold" text-anchor="middle">POST /api/generate</text>

    <rect x="18" y="150" width="144" height="34" rx="6" fill="#080B11" stroke="rgba(0, 150, 136, 0.3)"/>
    <text x="90" y="171" fill="#34D399" font-size="10" font-weight="bold" text-anchor="middle">GET /api/health</text>

    <rect x="18" y="194" width="144" height="34" rx="6" fill="#080B11" stroke="rgba(0, 150, 136, 0.3)"/>
    <text x="90" y="215" fill="#E5C07B" font-size="10" font-weight="bold" text-anchor="middle">Static /ui/dist Host</text>
  </g>

  <!-- Arrow 2: FastAPI -> LangGraph -->
  <path d="M450 250 L500 250" stroke="#D4AF37" stroke-width="2"/>

  <!-- Section 3: LangGraph 5-Branch Research -->
  <g transform="translate(500, 30)">
    <rect width="360" height="440" rx="16" fill="#101522" fill-opacity="0.9" stroke="rgba(255, 111, 0, 0.35)" stroke-width="1.2" filter="url(#shadowA)"/>
    <text x="180" y="32" fill="#FF6F00" font-size="16" text-anchor="middle">🦜🕸️</text>
    <text x="180" y="52" fill="#F8FAFC" font-size="14" font-weight="bold" text-anchor="middle">LangGraph StateGraph Engine</text>
    <text x="180" y="68" fill="#94A3B8" font-size="10" text-anchor="middle">Asynchronous State Reduction (operator.add)</text>
    <line x1="20" y1="80" x2="340" y2="80" stroke="rgba(212, 175, 55, 0.15)"/>

    <!-- 5 Branches Box -->
    <text x="24" y="98" fill="#F3E5AB" font-size="10" font-weight="bold">5 CONCURRENT DISJOINT RESEARCH BRANCHES:</text>
    
    <g transform="translate(20, 108)">
      <rect x="0" y="0" width="320" height="30" rx="6" fill="#080B11" stroke="rgba(212, 175, 55, 0.2)"/>
      <text x="10" y="19" fill="#F8FAFC" font-size="10">Branch 1: Static Company Foundation (Unbounded)</text>

      <rect x="0" y="36" width="320" height="30" rx="6" fill="#080B11" stroke="rgba(212, 175, 55, 0.2)"/>
      <text x="10" y="55" fill="#F8FAFC" font-size="10">Branch 2: Attendee Dossier (Disambiguated)</text>

      <rect x="0" y="72" width="320" height="30" rx="6" fill="#080B11" stroke="rgba(212, 175, 55, 0.2)"/>
      <text x="10" y="91" fill="#F8FAFC" font-size="10">Branch 3: 30-Day News (-launch -hiring)</text>

      <rect x="0" y="108" width="320" height="30" rx="6" fill="#080B11" stroke="rgba(212, 175, 55, 0.2)"/>
      <text x="10" y="127" fill="#F8FAFC" font-size="10">Branch 4: 30-Day Product Releases &amp; APIs</text>

      <rect x="0" y="144" width="320" height="30" rx="6" fill="#080B11" stroke="rgba(212, 175, 55, 0.2)"/>
      <text x="10" y="163" fill="#F8FAFC" font-size="10">Branch 5: 30-Day Hiring Signals (-jobboards)</text>
    </g>

    <!-- Dedup & Verifier -->
    <g transform="translate(20, 296)">
      <rect x="0" y="0" width="154" height="52" rx="8" fill="#080B11" stroke="rgba(212, 175, 55, 0.25)"/>
      <text x="77" y="22" fill="#D4AF37" font-size="10" font-weight="bold" text-anchor="middle">Dedup Register</text>
      <text x="77" y="38" fill="#94A3B8" font-size="9" text-anchor="middle">asyncio.Lock + SHA-256</text>

      <rect x="166" y="0" width="154" height="52" rx="8" fill="#080B11" stroke="rgba(79, 70, 229, 0.3)"/>
      <text x="243" y="22" fill="#6366F1" font-size="10" font-weight="bold" text-anchor="middle">Tavily Engine</text>
      <text x="243" y="38" fill="#94A3B8" font-size="9" text-anchor="middle">3-Tier Domain Filter</text>

      <rect x="0" y="62" width="320" height="58" rx="8" fill="#080B11" stroke="rgba(52, 211, 153, 0.35)"/>
      <text x="160" y="82" fill="#34D399" font-size="11" font-weight="bold" text-anchor="middle">Deterministic Evidence Grounding</text>
      <text x="160" y="100" fill="#94A3B8" font-size="9" text-anchor="middle">Alignment: 0.6*Entity + 0.4*Containment &bull; 4 Claim Statuses</text>
    </g>
  </g>

  <!-- Arrow 3: LangGraph -> Inference -->
  <path d="M860 250 L910 250" stroke="#D4AF37" stroke-width="2"/>

  <!-- Section 4: Tri-Mode Inference Routing -->
  <g transform="translate(910, 60)">
    <rect width="250" height="380" rx="16" fill="#101522" fill-opacity="0.9" stroke="rgba(99, 102, 241, 0.35)" stroke-width="1.2" filter="url(#shadowA)"/>
    <text x="125" y="36" fill="#6366F1" font-size="18" text-anchor="middle">🛡️</text>
    <text x="125" y="60" fill="#F8FAFC" font-size="14" font-weight="bold" text-anchor="middle">Tri-Mode Inference</text>
    <text x="125" y="78" fill="#94A3B8" font-size="10" text-anchor="middle">Resilient Multi-Tier Routing</text>
    <line x1="20" y1="92" x2="230" y2="92" stroke="rgba(212, 175, 55, 0.15)"/>

    <!-- Mode 1 -->
    <rect x="18" y="106" width="214" height="66" rx="8" fill="#080B11" stroke="rgba(99, 102, 241, 0.4)"/>
    <text x="28" y="126" fill="#6366F1" font-size="11" font-weight="bold">Mode 1: Maxim Bifrost Gateway</text>
    <text x="28" y="142" fill="#94A3B8" font-size="9">• Port 8080 &bull; x-bf-vk: sk-bf-*</text>
    <text x="28" y="158" fill="#94A3B8" font-size="9">• Response-Header Latency Telemetry</text>

    <!-- Mode 2 -->
    <rect x="18" y="186" width="214" height="66" rx="8" fill="#080B11" stroke="rgba(212, 175, 55, 0.3)"/>
    <text x="28" y="206" fill="#F3E5AB" font-size="11" font-weight="bold">Mode 2: Direct Provider SDK</text>
    <text x="28" y="222" fill="#94A3B8" font-size="9">• Gemini / OpenAI / Groq SDKs</text>
    <text x="28" y="238" fill="#94A3B8" font-size="9">• Automatic Failover when Offline</text>

    <!-- Mode 3 -->
    <rect x="18" y="266" width="214" height="66" rx="8" fill="#080B11" stroke="rgba(52, 211, 153, 0.3)"/>
    <text x="28" y="286" fill="#34D399" font-size="11" font-weight="bold">Mode 3: Deterministic Rules</text>
    <text x="28" y="302" fill="#94A3B8" font-size="9">• Zero-API Heuristic Grounding</text>
    <text x="28" y="318" fill="#94A3B8" font-size="9">• 100% Zero-Crash Guarantee</text>
  </g>
</svg>
